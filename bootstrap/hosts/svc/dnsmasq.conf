# ecloud lab DNS. Serves the ecloud.lab zone; forwards the rest upstream. Listens on bond0
# (its DC's svc IP) + loopback. Clients reach it via the PA firewalls' dns-dnat.
interface=bond0
listen-address=127.0.0.1
bind-interfaces
domain=ecloud.lab
local=/ecloud.lab/
expand-hosts
no-resolv
no-hosts
server=8.8.8.8
server=1.1.1.1
addn-hosts=/etc/ecloud.hosts
address=/anycast.ecloud.lab/10.80.15.50
address=/app.ecloud.lab/10.80.15.50
address=/dc1.ecloud.lab/10.80.15.51
address=/dc2.ecloud.lab/10.80.15.52
address=/client-1.ecloud.lab/10.80.15.53
address=/ext-client-2.ecloud.lab/10.80.15.54
