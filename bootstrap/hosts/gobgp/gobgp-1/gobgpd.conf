[global.config]
  as = 65400
  router-id = "10.201.20.2"

[global.apply-policy.config]
  export-policy-list = ["export-anycast-only"]
  default-export-policy = "reject-route"

[[defined-sets.prefix-sets]]
  prefix-set-name = "anycast"
  [[defined-sets.prefix-sets.prefix-list]]
    ip-prefix = "192.168.202.0/32"
  [[defined-sets.prefix-sets.prefix-list]]
    ip-prefix = "192.168.202.3/32"
  [[defined-sets.prefix-sets.prefix-list]]
    ip-prefix = "192.168.202.4/32"

[[policy-definitions]]
  name = "export-anycast-only"
  [[policy-definitions.statements]]
    name = "permit-anycast"
    [policy-definitions.statements.conditions.match-prefix-set]
      prefix-set = "anycast"
    [policy-definitions.statements.actions]
      route-disposition = "accept-route"

[[neighbors]]
  [neighbors.config]
    neighbor-address = "10.201.20.1"
    peer-as = 65400
  [[neighbors.afi-safis]]
    [neighbors.afi-safis.config]
      afi-safi-name = "ipv4-unicast"

[[neighbors]]
  [neighbors.config]
    neighbor-address = "10.201.20.5"
    peer-as = 65400
  [[neighbors.afi-safis]]
    [neighbors.afi-safis.config]
      afi-safi-name = "ipv4-unicast"
