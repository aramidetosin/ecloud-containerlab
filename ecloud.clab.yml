# ecloud two-DC EVPN-VXLAN POC, replicated in containerlab.
# Generated from the authoritative EVE-NG link map (84 p2p links + 1 shared internet segment).
# Switches: Cumulus VX 5.12.0 (vrnetlab VM-in-container). Firewalls: PA-VM 12.1.2 (vrnetlab).
# Hosts: plain linux containers, provisioned after deploy (k8s/Cilium, BIND, GoBGP, clients).
# NOTE: stock nvidia_cumulusvx does NOT apply startup-config. OUR image carries a patched vrnetlab
# launcher (cvx_startup_config.patch.py) that applies /config/startup-config.cfg over SSH once switchd
# is up, so the fabric BOOTSTRAPS ITSELF on `clab deploy`. bootstrap/*.cfg = filtered nv-set lines
# (no eth0/mgmt/hostname/REDACTED/aaa-user) from fabric-evpn-mh/. Creds cumulus/Clab123!.
name: ecloud
mgmt:
  network: ecloud-mgmt
  ipv4-subnet: 172.29.129.0/24     # same mgmt /24 as the EVE lab, but STATIC (no DHCP drift)
topology:
  kinds:
    nvidia_cumulusvx:
      image: vrnetlab/nvidia_cumulus-vx:5.12.0
    paloalto_panos:
      image: vrnetlab/paloalto_pa-vm:12.1.2
    linux:
      image: ghcr.io/srl-labs/network-multitool
  nodes:
    spine-1:
      kind: nvidia_cumulusvx
      mgmt-ipv4: 172.29.129.11
      group: dc1
      startup-config: bootstrap/spine-1.cfg   # applied at FIRST BOOT by the patched launcher
