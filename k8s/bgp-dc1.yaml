# DC1 Cilium BGP: masters peer the master-leaf pair (AS65111 @ 10.167.10.2/.3),
# workers peer the worker-leaf pair (AS65112 @ 10.167.20.2/.3). Local ASN 65010.
# Advertises LoadBalancer service IPs (the anycast + regional VIPs) to the leaves.
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: dc1-lb-pool
spec:
  blocks:
  - start: 192.168.202.0   # anycast VIP (same in both DCs)
    stop: 192.168.202.1    # + DC1 regional
  serviceSelector:
    matchExpressions:
    - {key: ecloud/dc, operator: In, values: ["dc1", "anycast"]}
---
apiVersion: cilium.io/v2alpha1
kind: CiliumBGPPeerConfig
metadata:
  name: leaf-peer
spec:
  timers:
    connectRetryTimeSeconds: 5
    holdTimeSeconds: 9
    keepAliveTimeSeconds: 3
  gracefulRestart:
    enabled: true
    restartTimeSeconds: 15
  families:
  - afi: ipv4
    safi: unicast
    advertisements:
      matchLabels:
        advertise: lb-vips
---
apiVersion: cilium.io/v2alpha1
kind: CiliumBGPAdvertisement
metadata:
  name: lb-vips
  labels:
    advertise: lb-vips
spec:
  advertisements:
  - advertisementType: Service
    service:
      addresses: ["LoadBalancerIP"]
    selector:
      matchExpressions:
      - {key: ecloud/dc, operator: Exists}
---
apiVersion: cilium.io/v2alpha1
kind: CiliumBGPClusterConfig
metadata:
  name: dc1-masters
spec:
  nodeSelector:
    matchLabels:
      node-role.kubernetes.io/control-plane: "true"
  bgpInstances:
  - name: instance-65010
    localASN: 65010
    peers:
    - name: master-leaf-1
      peerASN: 65111
      peerAddress: 10.167.10.2
      peerConfigRef: {name: leaf-peer}
    - name: master-leaf-2
      peerASN: 65111
      peerAddress: 10.167.10.3
      peerConfigRef: {name: leaf-peer}
---
apiVersion: cilium.io/v2alpha1
kind: CiliumBGPClusterConfig
metadata:
  name: dc1-workers
spec:
  nodeSelector:
    matchExpressions:
    - {key: node-role.kubernetes.io/control-plane, operator: DoesNotExist}
  bgpInstances:
  - name: instance-65010
    localASN: 65010
    peers:
    - name: worker-leaf-1
      peerASN: 65112
      peerAddress: 10.167.20.2
      peerConfigRef: {name: leaf-peer}
    - name: worker-leaf-2
      peerASN: 65112
      peerAddress: 10.167.20.3
      peerConfigRef: {name: leaf-peer}
