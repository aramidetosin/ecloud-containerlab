# dc-demo (DC2): the RICH ecloud demo app; see dc-demo-dc1.yaml for the design notes.
# Same app file, identity flipped via env; regional VIP 192.168.202.2.
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dc-demo
  namespace: demo
spec:
  replicas: 3
  selector: {matchLabels: {app: dc-demo}}
  template:
    metadata: {labels: {app: dc-demo}}
    spec:
      containers:
      - name: web
        image: python:3.12-alpine
        imagePullPolicy: IfNotPresent
        command: ["python3", "/app/app.py"]
        ports: [{containerPort: 8080}]
        readinessProbe:
          httpGet: {path: /healthz, port: 8080}
          initialDelaySeconds: 3
          periodSeconds: 5
        volumeMounts: [{name: app, mountPath: /app}]
        env:
        - {name: DC, value: "DC2"}
        - {name: PEER_DC, value: "DC1"}
        - {name: PEER_PORT, value: "30080"}
        # peer DC's node fabric IPs; the cross-region consumer hits <ip>:30080 over the backbone
        - {name: PEER_NODES, value: "10.167.20.11,10.167.20.12,10.167.20.13,10.167.10.11,10.167.10.12,10.167.10.13"}
        - {name: NODE_NAME, valueFrom: {fieldRef: {fieldPath: spec.nodeName}}}
        - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
        - {name: POD_IP, valueFrom: {fieldRef: {fieldPath: status.podIP}}}
      volumes:
      - name: app
        configMap: {name: dc-demo-app}
---
# NodePort for the PEER DC's cross-region consumer (reached on node fabric IPs over the backbone)
apiVersion: v1
kind: Service
metadata:
  name: dc-demo-nodeport
  namespace: demo
  labels: {app: dc-demo}
spec:
  type: NodePort
  selector: {app: dc-demo}
  ports:
    - {name: http, port: 8080, targetPort: 8080, nodePort: 30080}
---
apiVersion: v1
kind: Service
metadata:
  name: dc-demo-anycast
  namespace: demo
  labels: {app: dc-demo, ecloud/dc: anycast}
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.202.0
  externalTrafficPolicy: Cluster
  selector: {app: dc-demo}
  ports:
    - {name: http, port: 80, targetPort: 8080}
---
apiVersion: v1
kind: Service
metadata:
  name: dc-demo-dc2
  namespace: demo
  labels: {app: dc-demo, ecloud/dc: dc2}
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.202.2
  externalTrafficPolicy: Cluster
  selector: {app: dc-demo}
  ports:
    - {name: http, port: 80, targetPort: 8080}
