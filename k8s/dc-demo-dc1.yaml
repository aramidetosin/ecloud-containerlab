# dc-demo app in DC1: a tiny HTTP server + LoadBalancer services (anycast VIP 192.168.202.0 +
# DC1 regional 192.168.202.1). Cilium advertises the LB IPs to the leaves via BGP.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dc-demo
  namespace: default
spec:
  replicas: 3
  selector: {matchLabels: {app: dc-demo}}
  template:
    metadata: {labels: {app: dc-demo}}
    spec:
      containers:
      - name: web
        image: python:3.12-alpine
        imagePullPolicy: IfNotPresent
        command: ["python3","-c"]
        args:
        - |
          import http.server,socket,os
          class H(http.server.BaseHTTPRequestHandler):
            def do_GET(s):
              s.send_response(200); s.send_header('Content-Type','text/plain'); s.end_headers()
              s.wfile.write(f"DC1 dc-demo | served by {socket.gethostname()} | node {os.environ.get('NODE_NAME','?')}\n".encode())
            def log_message(s,*a): pass
          http.server.HTTPServer(('0.0.0.0',8080),H).serve_forever()
        ports: [{containerPort: 8080}]
        env:
        - {name: NODE_NAME, valueFrom: {fieldRef: {fieldPath: spec.nodeName}}}
---
apiVersion: v1
kind: Service
metadata:
  name: dc-demo-anycast
  namespace: default
  labels: {ecloud/dc: anycast}
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.202.0
  externalTrafficPolicy: Cluster
  selector: {app: dc-demo}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: v1
kind: Service
metadata:
  name: dc-demo-dc1
  namespace: default
  labels: {ecloud/dc: dc1}
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.202.1
  externalTrafficPolicy: Cluster
  selector: {app: dc-demo}
  ports: [{port: 80, targetPort: 8080}]
