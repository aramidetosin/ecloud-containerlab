# dc-demo (DC1): the RICH ecloud demo app (region-picker, /docs, cross-region consumer,
# live-traceroute path map), faithful to the EVE original: namespace demo, app + docs mounted
# from the dc-demo-app ConfigMap (created by cluster-bootstrap from /opt/ecloud/demo/ with
# create/replace, NOT apply: docs.html >256KB overflows the last-applied annotation).
# Identity comes entirely from env (app-dc1.py == app-dc2.py). /healthz keeps the GoBGP brain fed.
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dc-demo
  namespace: demo
spec:
  replicas: 3
  selector: {matchLabels: {app: dc-demo}}
  template:
    metadata: {labels: {app: dc-demo}}
    spec:
      containers:
      - name: web
        image: python:3.12-alpine
        imagePullPolicy: IfNotPresent
        command: ["python3", "/app/app.py"]
        ports: [{containerPort: 8080}]
        readinessProbe:
          httpGet: {path: /healthz, port: 8080}
          initialDelaySeconds: 3
          periodSeconds: 5
        volumeMounts: [{name: app, mountPath: /app}]
        env:
        - {name: DC, value: "DC1"}
        - {name: PEER_DC, value: "DC2"}
        - {name: PEER_PORT, value: "30080"}
        # peer DC's node fabric IPs; the cross-region consumer hits <ip>:30080 over the backbone
        - {name: PEER_NODES, value: "10.168.10.21,10.168.10.22,10.168.10.23,10.168.10.11"}
        - {name: NODE_NAME, valueFrom: {fieldRef: {fieldPath: spec.nodeName}}}
        - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
        - {name: POD_IP, valueFrom: {fieldRef: {fieldPath: status.podIP}}}
      volumes:
      - name: app
        configMap: {name: dc-demo-app}
---
# NodePort for the PEER DC's cross-region consumer (reached on node fabric IPs over the backbone)
apiVersion: v1
kind: Service
metadata:
  name: dc-demo-nodeport
  namespace: demo
  labels: {app: dc-demo}
spec:
  type: NodePort
  selector: {app: dc-demo}
  ports:
    - {name: http, port: 8080, targetPort: 8080, nodePort: 30080}
---
apiVersion: v1
kind: Service
metadata:
  name: dc-demo-anycast
  namespace: demo
  labels: {app: dc-demo, ecloud/dc: anycast}
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.202.0
  externalTrafficPolicy: Cluster
  selector: {app: dc-demo}
  ports:
    - {name: http, port: 80, targetPort: 8080}
---
apiVersion: v1
kind: Service
metadata:
  name: dc-demo-dc1
  namespace: demo
  labels: {app: dc-demo, ecloud/dc: dc1}
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.202.1
  externalTrafficPolicy: Cluster
  selector: {app: dc-demo}
  ports:
    - {name: http, port: 80, targetPort: 8080}
